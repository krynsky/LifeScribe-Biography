[package]
name = "lifescribe"
version = "0.2.1"
description = "LifeScribe — Local-First Biography App"
authors = ["LifeScribe"]
license = ""
repository = ""
default-run = "lifescribe"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lifescribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lifescribe"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# Photo processing
image = { version = "0.25", features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
kamadak-exif = "0.5"

# Archive extraction
zip = "2"

# Utilities
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
tempfile = "3"
base64 = "0.22"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
